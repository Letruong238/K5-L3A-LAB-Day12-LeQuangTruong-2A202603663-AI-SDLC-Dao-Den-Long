<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Đèn Lồng</title>
<style>
  :root { --sky:#0E1430; --fog:#1B2350; --lamp:#FFB347; --core:#FFE9B0; --gold:#F2C14E; --danger:#FF5A5F; --text:#F5F1E6; --scarf:#C8102E; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--sky); font-family:system-ui,sans-serif; color:var(--text); user-select:none; }
  canvas { display:block; }
  .hud { position:fixed; pointer-events:none; text-shadow:0 1px 4px #000; font-size:18px; }
  #flames { top:12px; left:14px; font-size:26px; }
  #timer { top:10px; left:50%; transform:translateX(-50%); font-size:30px; font-weight:700; font-variant-numeric:tabular-nums; }
  #timer.low { color:var(--danger); animation:blink .6s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.25; } }
  #stats { top:12px; right:14px; text-align:right; }
  #stats b { color:var(--gold); }
  #motes { bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:5px; }
  #motes i { width:18px; height:18px; border-radius:50%; background:rgba(255,246,194,.12); border:1px solid rgba(255,229,138,.4); }
  #motes i.on { background:#FFF6C2; box-shadow:0 0 8px #FFE58A; }
  #cds { bottom:16px; right:16px; display:flex; gap:12px; }
  .cd { width:54px; height:54px; border-radius:50%; border:2px solid var(--gold); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; background:rgba(14,20,48,.6); position:relative; overflow:hidden; }
  .cd b { font-size:15px; }
  .cd .fill { position:absolute; left:0; bottom:0; width:100%; background:rgba(255,179,71,.35); }
  .cd.ready { box-shadow:0 0 10px var(--lamp); }
  #charm { bottom:80px; right:16px; font-size:14px; color:var(--scarf); background:var(--gold); padding:2px 10px; border-radius:10px; display:none; }
  #prompt { bottom:70px; left:50%; transform:translateX(-50%); font-size:20px; color:var(--core); display:none; }
  #arrow { position:fixed; width:0; height:0; border-left:12px solid transparent; border-right:12px solid transparent; border-bottom:26px solid var(--lamp); display:none; pointer-events:none; filter:drop-shadow(0 0 6px #000); }
  #toast { top:60px; left:50%; transform:translateX(-50%); color:var(--gold); font-size:20px; opacity:0; transition:opacity .3s; }
  #fps { top:44px; left:14px; font-size:12px; opacity:.7; display:none; }
  #help { bottom:6px; left:10px; font-size:12px; opacity:.6; }
  .overlay { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(8,10,28,.82); text-align:center; padding:20px; box-sizing:border-box; }
  .overlay.show { display:flex; }
  .overlay h1 { font-size:42px; margin:0 0 8px; color:var(--lamp); }
  .overlay h2 { font-size:28px; margin:0 0 6px; color:var(--gold); }
  .overlay p { font-size:19px; margin:5px 0; max-width:560px; line-height:1.45; }
  .overlay .quote { font-style:italic; color:var(--core); }
  button { margin:6px; padding:10px 26px; font-size:18px; border:0; border-radius:8px; background:var(--lamp); color:#2a1200; cursor:pointer; }
  button.sec { background:#3a4268; color:var(--text); }
  button:hover { filter:brightness(1.12); }
  label { display:flex; gap:12px; align-items:center; margin:8px; font-size:18px; }
  input[type=range] { width:200px; }
</style>
</head>
<body>
<div id="flames" class="hud"></div>
<div id="timer" class="hud"></div>
<div id="stats" class="hud"></div>
<div id="motes" class="hud"></div>
<div id="cds" class="hud">
  <div class="cd" id="cd-dash"><span>Lướt</span><b>Shift</b><div class="fill"></div></div>
  <div class="cd" id="cd-pulse"><span>Tỏa sáng</span><b>F</b><div class="fill"></div></div>
</div>
<div id="charm" class="hud"></div>
<div id="prompt" class="hud"></div>
<div id="arrow"></div>
<div id="toast" class="hud"></div>
<div id="fps" class="hud"></div>
<div id="help" class="hud">WASD đi · Space nhảy · Shift lướt · E nạp đèn · F tỏa sáng · kéo chuột hoặc ← → xoay · Esc/P tạm dừng</div>

<div id="menu" class="overlay show">
  <h1>Đảo Đèn Lồng</h1>
  <p class="quote">Mây, người giữ đèn nhỏ tuổi, phải thắp lại ba hòn đảo trước khi trời sáng.</p>
  <button id="b-play">Bắt đầu</button>
  <button id="b-menu-settings" class="sec">Cài đặt</button>
</div>
<div id="intro" class="overlay">
  <h2 id="intro-title"></h2>
  <p id="intro-detail"></p>
  <p class="quote" id="intro-quote"></p>
  <button id="b-go">Vào đêm (Enter)</button>
</div>
<div id="result" class="overlay">
  <h1 id="res-title"></h1>
  <p id="res-detail"></p>
  <p id="res-score"></p>
  <button id="b-next">Đêm kế tiếp</button>
  <button id="b-retry" class="sec">Chơi lại đêm này</button>
  <button id="b-res-menu" class="sec">Về menu</button>
</div>
<div id="dawn" class="overlay">
  <h1>Bình Minh</h1>
  <p>Ba hòn đảo đã sáng đèn. Mặt trời lên trên biển mây.</p>
  <p id="dawn-score"></p>
  <button id="b-dawn-menu">Về menu</button>
</div>
<div id="pause" class="overlay">
  <h2>Tạm dừng</h2>
  <button id="b-resume">Tiếp tục</button>
  <button id="b-restart" class="sec">Chơi lại đêm</button>
  <button id="b-pause-settings" class="sec">Cài đặt</button>
  <button id="b-pause-menu" class="sec">Về menu</button>
</div>
<div id="settings" class="overlay">
  <h2>Cài đặt</h2>
  <label>Âm lượng <input id="s-vol" type="range" min="0" max="1" step="0.05"><span id="s-vol-v"></span></label>
  <label>Độ nhạy chuột <input id="s-sens" type="range" min="0.2" max="2" step="0.1"><span id="s-sens-v"></span></label>
  <button id="b-settings-back">Xong</button>
</div>

<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
<script type="module" src="/web/main.js"></script>
</body>
</html>
